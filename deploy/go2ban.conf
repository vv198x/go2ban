firewall=auto
log_dir=/var/log/go2ban
#white_list=192.168.0.1 192.168.0.*
grpc_port=2048/tcp #default off
#rest_port=3072 #default off
blocked_ips=4000
trap_ports=22 21 3389 139 445 3306 1433 2222 222 8080 5432 6379 27017 9200 5601 9090 3000 5000 #default off
trap_fails=2
abuseipdb_apikey= #default off
abuseipdb_ips=2000
local_service_check_minutes=20
local_service_fails=2
#Checking for wrong login attempts to local services
#Services can have any name
{
  "Service":[
    {"On":true,"Name":"sshd_cent","Regxp": "Failed password","LogFile":"/var/log/secure"},
    {"On":false,"Name":"sshd_ubuntu","Regxp": "Failed password","LogFile":"/var/log/auth.log"},
    {"On":false,"Name":"ssh_bastion","Regxp": "Failed password","LogFile":"/var/log/bastion.log"},
    {"On":true,"Name":"postgres_docker","Regxp": "password authentication failed","LogFile":"docker"},
    {"On":false,"Name":"postgres_local","Regxp": "password authentication failed","LogFile":"/var/log/postgresql/postgresql-14-main.log"},
    {"On":false,"Name":"mysql_local","Regxp": "Access denied","LogFile":"/var/log/mysql/error.log"},
    {"On":false,"Name":"mysql_docker","Regxp": "Access denied","LogFile":"docker"},
    {"On":false,"Name":"mongodb_local","Regxp": "Authentication failed","LogFile":"/var/log/mongodb/mongod.log"},
    {"On":false,"Name":"mongodb_docker","Regxp": "Authentication failed","LogFile":"docker"},
    {"On":false,"Name":"redis_local","Regxp": "Authentication failed","LogFile":"/var/log/redis/redis.log"},
    {"On":false,"Name":"redis_docker","Regxp": "Authentication failed","LogFile":"docker"},
    {"On":false,"Name":"nginx_local","Regxp": "user .* was not found","LogFile":"/var/log/nginx/error.log"},
    {"On":false,"Name":"nginx_access","Regxp": "HTTP/1.1\" 401","LogFile":"/var/log/nginx/access.log"},
    {"On":false,"Name":"apache_local","Regxp": "Unauthorized","LogFile":"/var/log/httpd/error_log"},
    {"On":false,"Name":"apache_access","Regxp": "HTTP/1.1\" 401","LogFile":"/var/log/httpd/access_log"},
    {"On":false,"Name":"tomcat_local","Regxp": "login failed","LogFile":"/var/log/tomcat8/catalina.out"},
    {"On":false,"Name":"ftp_local","Regxp": "Login incorrect","LogFile":"/var/log/vsftpd.log"},
    {"On":false,"Name":"ftp_vsftpd","Regxp": "LOGIN FAILURE","LogFile":"/var/log/vsftpd.log"},
    {"On":false,"Name":"sftp_local","Regxp": "authentication failure","LogFile":"/var/log/secure"},
    {"On":false,"Name":"smb_local","Regxp": "Login failed","LogFile":"/var/log/samba/log.smbd"},
    {"On":false,"Name":"telnet_local","Regxp": "Login failed","LogFile":"/var/log/secure"},
    {"On":false,"Name":"mail_local","Regxp": "Authentication failure","LogFile":"/var/log/mail.log"},
    {"On":false,"Name":"postfix_local","Regxp": "authentication failed","LogFile":"/var/log/mail.log"},
    {"On":false,"Name":"dovecot_local","Regxp": "authentication failure","LogFile":"/var/log/mail.log"},
    {"On":false,"Name":"ldap_local","Regxp": "Invalid credentials","LogFile":"/var/log/ldap/slapd.log"},
    {"On":false,"Name":"kerberos_local","Regxp": "authentication failure","LogFile":"/var/log/secure"},
    {"On":false,"Name":"couchdb_local","Regxp": "Authentication failed","LogFile":"/var/log/couchdb/couch.log"},
    {"On":false,"Name":"elasticsearch_local","Regxp": "authentication failed","LogFile":"/var/log/elasticsearch/elasticsearch.log"},
    {"On":false,"Name":"kibana_local","Regxp": "authentication failed","LogFile":"/var/log/kibana/kibana.log"},
    {"On":false,"Name":"grafana_local","Regxp": "authentication failed","LogFile":"/var/log/grafana/grafana.log"},
    {"On":false,"Name":"prometheus_local","Regxp": "authentication failed","LogFile":"/var/log/prometheus/prometheus.log"},
    {"On":false,"Name":"docker_local","Regxp": "authentication failed","LogFile":"/var/log/docker.log"},
    {"On":false,"Name":"kubernetes_local","Regxp": "authentication failed","LogFile":"/var/log/kubernetes/kube-apiserver.log"},
    {"On":false,"Name":"openvpn_local","Regxp": "authentication failed","LogFile":"/var/log/openvpn/openvpn.log"},
    {"On":false,"Name":"wireguard_local","Regxp": "authentication failed","LogFile":"/var/log/wireguard/wg0.log"},
    {"On":false,"Name":"modsecurity_local","Regxp": "Access denied","LogFile":"/var/log/modsec_audit.log"},
    {"On":false,"Name":"fail2ban_local","Regxp": "authentication failure","LogFile":"/var/log/fail2ban.log"},
    {"On":false,"Name":"aws_cli","Regxp": "authentication failed","LogFile":"/var/log/aws/aws.log"},
    {"On":false,"Name":"azure_cli","Regxp": "authentication failed","LogFile":"/var/log/azure/azure.log"},
    {"On":false,"Name":"rsyslog_local","Regxp": "authentication failed","LogFile":"/var/log/rsyslog.log"},
    {"On":false,"Name":"logstash_local","Regxp": "authentication failed","LogFile":"/var/log/logstash/logstash.log"},
    {"On":false,"Name":"git_local","Regxp": "authentication failed","LogFile":"/var/log/git/git.log"},
